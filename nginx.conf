server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads grandes (ex.: Base de Referência com dezenas de milhares de linhas).
    # Sem isso vale o default do nginx (1 MB) e o POST /api/base_referencia/bulk_upsert
    # com >~13 mil linhas (>1 MB) é cortado com 413 ANTES de chegar no Django — foi o
    # que travava a atualização da Base de Referência (planilhas grandes).
    client_max_body_size 50M;

    # API Django (same-origin). Com isso o cookie .dunatecnologia.com chega no
    # backend e o SSO valida server-side (igual Flow/DOC). O serviço do backend
    # no docker-compose se chama "backend" e roda gunicorn na 8080.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Admin do Django + estáticos do admin (mesma origem).
    location /admin/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://backend:8080;
    }

    # SPA (React) — qualquer outra rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
