services:
  backend:
    build: 
      context: ./backend-mdr
    container_name: painelfinanceiro_back
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - TZ=America/Fortaleza
    # O Gunicorn definido no seu Dockerfile vai rodar na porta 8080 internamente
    volumes:
      - sqlite_data:/app/data

  frontend:
    build: 
      context: .
      args:
        # Same-origin: o front chama /api (relativo) e o nginx faz proxy pro
        # backend interno. Habilita o cookie .dunatecnologia.com chegar no
        # Django pro SSO. (Antes era ${SERVICE_URL_BACKEND}, domínio separado.)
        - VITE_API_URL=/api
    container_name: painelfinanceiro_front
    depends_on:
      - backend
    # O Nginx definido no seu Dockerfile vai rodar na porta 80 internamente
volumes:
  sqlite_data: